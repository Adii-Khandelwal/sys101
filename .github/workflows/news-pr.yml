name: News PR check

# Checks the pull requests a routine opens to update "What's new" (docs/whats-new.md, docs/routines/README.md).
#
# It runs on pull_request_target, so the workflow, the scripts and node_modules always come from the BASE branch and
# a pull request cannot change the code that judges it. The pull request's files are checked out into pr/ and are only
# ever read as data: nothing in pr/ is installed, built or executed. Only content/news/**/*.json and
# docs/news-state.json are copied out of it, after the path guard has passed.
#
# The job is named "news-pr" so branch protection can require it. It runs on every pull request, so a required check
# never sits pending on an ordinary one. What counts as a news pull request is decided in scripts/news-guard.mjs
# (isNewsPr): any claude/ branch that is named claude/news-* or touches a news path, and a person's branch only when
# it changes nothing but news files. Anything else passes at once and gets no automatic merge; a person's pull
# request that mixes news data with code is theirs to review, and the Vercel build still runs check-news on it.
# Two rules hold for every pull request: the checks use the base branch's docs/news-state.json allowlist only (a pull
# request that changes allowedDomains fails), and a pull request from a fork never reaches verify:news or auto-merge.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Read-only by default. Only the auto-merge job below is given more.
permissions:
  contents: read

concurrency:
  group: news-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: news-pr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      news: ${{ steps.guard.outputs.news }}
      fork: ${{ steps.guard.outputs.fork }}
    steps:
      # The base branch: this is the code that runs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Only news files may change (base branch script, file list from the API)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | {filename, previous_filename}' > "$RUNNER_TEMP/files.ndjson"
          node scripts/news-guard.mjs paths "$RUNNER_TEMP/files.ndjson" "$HEAD_REF" "$CHANGED" "$HEAD_REPO" "$REPO"
      # The pull request, as data in its own directory. Never installed, built or run.
      - if: steps.guard.outputs.news == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: pr
          persist-credentials: false
      - if: steps.guard.outputs.news == 'true'
        name: Take only the news data from the pull request
        run: |
          set -euo pipefail
          # A symlink could point at a runner file the checks would then read; refuse any.
          if [ -n "$(find pr/content/news pr/docs/news-state.json -type l 2>/dev/null)" ]; then
            echo "A symlink under content/news or docs/news-state.json is not allowed."
            exit 1
          fi
          cp docs/news-state.json "$RUNNER_TEMP/base-state.json"
          # Every pull request is checked against the base branch's allowlist only; one that changes it fails here.
          node scripts/news-guard.mjs state "$RUNNER_TEMP/base-state.json" pr/docs/news-state.json
          rm -rf content/news
          if [ -d pr/content/news ]; then cp -R pr/content/news content/news; else mkdir -p content/news; fi
          cp pr/docs/news-state.json docs/news-state.json
          # Nothing from the pull request may stay in the workspace: vitest and tsc would otherwise find its files.
          rm -rf pr
      - if: steps.guard.outputs.news == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.guard.outputs.news == 'true'
        run: npm ci
      - if: steps.guard.outputs.news == 'true'
        name: Build with the base code and the pull request's news data (runs check-news, the SEO check, the search index)
        run: npm run build
      - if: steps.guard.outputs.news == 'true'
        run: npm test
      - if: steps.guard.outputs.news == 'true'
        run: node scripts/check-news.mjs
      - if: steps.guard.outputs.news == 'true' && steps.guard.outputs.fork != 'true'
        name: Open every item URL and confirm its evidence and date
        run: npm run verify:news
      # A pull request from a fork never makes the runner fetch anything: its URLs are not opened.
      - if: steps.guard.outputs.news == 'true' && steps.guard.outputs.fork == 'true'
        name: Fork pull request, network verification skipped
        run: |
          echo "fork PR: network verification skipped, merge manually"

  # Off unless the repository variable NEWS_AUTOMERGE is 'true' (docs/routines/README.md, section 7: do not set it before
  # the test pull request has failed the guard). Only same-repository claude/ branches that passed. `--auto` waits for the
  # required checks in branch protection and merges when they are green. Nothing here checks out or runs pull request code.
  automerge:
    name: news-automerge
    needs: check
    if: >-
      vars.NEWS_AUTOMERGE == 'true' &&
      needs.check.result == 'success' &&
      needs.check.outputs.news == 'true' &&
      needs.check.outputs.fork != 'true' &&
      startsWith(github.head_ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
