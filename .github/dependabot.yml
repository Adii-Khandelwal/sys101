# Actions are pinned to commit hashes (lib/workflows.test.ts); this opens a pull request when a newer release exists.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A major version can break the build (eslint 10 against eslint-config-next, sigma 4 against GraphView), so it is done by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
